name: Build SubBro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate SubBro Android Project
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/subbro/translator

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "SubBro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.subbro.translator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.subbro.translator"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="SubBro"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">SubBro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#7C4DFF" />
              <stroke
                  android:width="2dp"
                  android:color="#FFFFFF" />
              <size
                  android:width="54dp"
                  android:height="54dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_subtitle_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E60D0D14" />
              <corners android:radius="14dp" />
              <stroke
                  android:width="1.5dp"
                  android:color="#7C4DFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="26dp"
              android:background="#0A0A0F">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🌐 SubBro"
                  android:textColor="#FFFFFF"
                  android:textSize="32sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Offline Realtime Hinglish Translator"
                  android:textColor="#8F8FA3"
                  android:textSize="14sp" />

              <Button
                  android:id="@+id/btnStartEngine"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_marginTop="48dp"
                  android:text="Start SubBro Bubble"
                  android:backgroundTint="#7C4DFF"
                  android:textColor="#FFFFFF"
                  android:textSize="16sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:gravity="center"
                  android:text="Tap bubble to translate screen.\nLong press bubble to close."
                  android:textColor="#5C5C70"
                  android:textSize="12sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/layout_floating_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/bubble_container"
              android:layout_width="54dp"
              android:layout_height="54dp"
              android:background="@drawable/bg_circle_bubble">

              <TextView
                  android:id="@+id/tvBubbleIcon"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:text="🌐"
                  android:textSize="22sp" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/layout_subtitle_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/subtitle_container"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="@drawable/bg_subtitle_card"
              android:padding="16dp">

              <TextView
                  android:id="@+id/tvOriginalText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Detected Text..."
                  android:textColor="#9E9EAF"
                  android:textSize="12sp" />

              <TextView
                  android:id="@+id/tvHinglishText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:text="SubBro Translating..."
                  android:textColor="#00E676"
                  android:textSize="16sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/subbro/translator/HinglishEngine.kt
          package com.subbro.translator

          import java.util.Locale

          object HinglishEngine {
              private val dictionary = mapOf(
                  "game over" to "Khel khatam!",
                  "you died" to "Tu mar gaya bhai!",
                  "victory" to "Jeet gaye!",
                  "defeat" to "Haar gaye!",
                  "start game" to "Game shuru karo",
                  "press any button" to "Koi bhi button dabao",
                  "quest completed" to "Mission complete ho gaya!",
                  "mission failed" to "Mission fail ho gaya!",
                  "inventory is full" to "Bag full ho gaya hai",
                  "enemy spotted" to "Dushman dikh gaya!",
                  "help me" to "Meri madad karo!",
                  "wait for me" to "Mera intezar karo",
                  "let's go" to "Chalo chalte hain!",
                  "are you ready" to "Taiyyar ho?",
                  "i don't know" to "Mujhe nahi pata",
                  "what are you doing" to "Tu kya kar raha hai?",
                  "who are you" to "Tum kaun ho?",
                  "warning" to "Savdhan raho",
                  "danger" to "Khatra hai",
                  "attack" to "Hamla karo!",
                  "defend" to "Bacho!",
                  "run away" to "Bhaago yahan se!",
                  "yes" to "Haan",
                  "no" to "Nahi",
                  "ok" to "Theek hai",
                  "loading" to "Load ho raha hai..."
              )

              fun toHinglish(rawText: String): String {
                  val clean = rawText.trim()
                  if (clean.isEmpty()) return "Screen par koi text nahi mila!"
                  
                  val lower = clean.lowercase(Locale.ROOT)
                  for ((key, value) in dictionary) {
                      if (lower.contains(key)) {
                          return value
                      }
                  }

                  // Smart general word-by-word replacement fallback
                  var translated = clean
                  val wordMap = mapOf(
                      "the" to "",
                      "is" to "hai",
                      "are" to "hain",
                      "you" to "tum",
                      "i" to "main",
                      "we" to "hum",
                      "this" to "yeh",
                      "that" to "woh",
                      "kill" to "khatam karo",
                      "find" to "dhundo",
                      "door" to "darwaza",
                      "open" to "kholo",
                      "locked" to "band hai",
                      "secret" to "chupa hua"
                  )
                  for ((eng, hin) in wordMap) {
                      val regex = ("\\b(?i)" + eng + "\\b").toRegex()
                      translated = translated.replace(regex, hin)
                  }
                  return if (translated == clean) "Original: $clean" else translated.trim()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/subbro/translator/MainActivity.kt
          package com.subbro.translator

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private val OVERLAY_REQ_CODE = 2001
              private val PROJECTION_REQ_CODE = 2002
              private lateinit var projectionManager: MediaProjectionManager

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  val btnStart = findViewById<Button>(R.id.btnStartEngine)
                  btnStart.setOnClickListener {
                      if (checkOverlayPermission()) {
                          requestScreenCapture()
                      } else {
                          requestOverlayPermission()
                      }
                  }
              }

              private fun checkOverlayPermission(): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else true
              }

              private fun requestOverlayPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, OVERLAY_REQ_CODE)
                  }
              }

              private fun requestScreenCapture() {
                  startActivityForResult(
                      projectionManager.createScreenCaptureIntent(),
                      PROJECTION_REQ_CODE
                  )
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == OVERLAY_REQ_CODE) {
                      if (checkOverlayPermission()) {
                          requestScreenCapture()
                      } else {
                          Toast.makeText(this, "Overlay permission zaroori hai!", Toast.LENGTH_SHORT).show()
                      }
                  } else if (requestCode == PROJECTION_REQ_CODE) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val serviceIntent = Intent(this, FloatingService::class.java).apply {
                              putExtra("RESULT_CODE", resultCode)
                              putExtra("DATA_INTENT", data)
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent)
                          } else {
                              startService(serviceIntent)
                          }
                          Toast.makeText(this, "SubBro Active! Bubble tap karo translate karne ke liye.", Toast.LENGTH_LONG).show()
                          finish()
                      } else {
                          Toast.makeText(this, "Screen capture permission zaroori hai!", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/subbro/translator/FloatingService.kt
          package com.subbro.translator

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions

          class FloatingService : Service() {
              private var windowManager: WindowManager? = null
              private var bubbleView: View? = null
              private var subtitleView: View? = null
              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createNotification()
                  
                  val resultCode = intent?.getIntExtra("RESULT_CODE", -1) ?: -1
                  val dataIntent = intent?.getParcelableExtra<Intent>("DATA_INTENT")

                  if (resultCode != -1 && dataIntent != null) {
                      val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mediaProjection = projectionManager.getMediaProjection(resultCode, dataIntent)
                      setupVirtualDisplay()
                  }

                  if (bubbleView == null) {
                      setupFloatingBubble()
                  }
                  return START_NOT_STICKY
              }

              private fun createNotification() {
                  val channelId = "subbro_service"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "SubBro Active", NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("SubBro Translator Running")
                      .setContentText("Tap bubble anytime to translate screen")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()
                  startForeground(1001, notification)
              }

              private fun setupVirtualDisplay() {
                  val metrics = resources.displayMetrics
                  imageReader = ImageReader.newInstance(metrics.widthPixels, metrics.heightPixels, PixelFormat.RGBA_8888, 2)
                  virtualDisplay = mediaProjection?.createVirtualDisplay(
                      "SubBroDisplay",
                      metrics.widthPixels,
                      metrics.heightPixels,
                      metrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader?.surface,
                      null,
                      null
                  )
              }

              private fun setupFloatingBubble() {
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  bubbleView = LayoutInflater.from(this).inflate(R.layout.layout_floating_bubble, null)

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )

                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 80
                  params.y = 300

                  windowManager?.addView(bubbleView, params)

                  bubbleView?.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var isClick = true

                      override fun onTouch(v: View?, event: MotionEvent?): Boolean {
                          when (event?.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  isClick = true
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val diffX = (event.rawX - initialTouchX).toInt()
                                  val diffY = (event.rawY - initialTouchY).toInt()
                                  if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) {
                                      isClick = false
                                  }
                                  params.x = initialX + diffX
                                  params.y = initialY + diffY
                                  windowManager?.updateViewLayout(bubbleView, params)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (isClick) {
                                      captureAndTranslateScreen()
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  bubbleView?.setOnLongClickListener {
                      Toast.makeText(this, "SubBro Closed", Toast.LENGTH_SHORT).show()
                      stopSelf()
                      true
                  }
              }

              private fun captureAndTranslateScreen() {
                  val image = imageReader?.acquireLatestImage()
                  if (image == null) {
                      showSubtitle("Screen capturing...", "Dubara tap karein")
                      return
                  }

                  val planes = image.planes
                  val buffer = planes[0].buffer
                  val pixelStride = planes[0].pixelStride
                  val rowStride = planes[0].rowStride
                  val rowPadding = rowStride - pixelStride * image.width

                  val bitmap = Bitmap.createBitmap(
                      image.width + rowPadding / pixelStride,
                      image.height,
                      Bitmap.Config.ARGB_8888
                  )
                  bitmap.copyPixelsFromBuffer(buffer)
                  image.close()

                  val inputImage = InputImage.fromBitmap(bitmap, 0)
                  recognizer.process(inputImage)
                      .addOnSuccessListener { visionText ->
                          val detected = visionText.text
                          val translated = HinglishEngine.toHinglish(detected)
                          showSubtitle(detected, translated)
                      }
                      .addOnFailureListener {
                          showSubtitle("Error", "OCR read karne me dikkat aayi")
                      }
              }

              private fun showSubtitle(original: String, hinglish: String) {
                  mainHandler.post {
                      if (subtitleView == null) {
                          subtitleView = LayoutInflater.from(this).inflate(R.layout.layout_subtitle_card, null)
                          val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          } else {
                              WindowManager.LayoutParams.TYPE_PHONE
                          }
                          val params = WindowManager.LayoutParams(
                              (resources.displayMetrics.widthPixels * 0.9).toInt(),
                              WindowManager.LayoutParams.WRAP_CONTENT,
                              layoutType,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                              PixelFormat.TRANSLUCENT
                          )
                          params.gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                          params.y = 120
                          windowManager?.addView(subtitleView, params)

                          subtitleView?.setOnClickListener {
                              windowManager?.removeView(subtitleView)
                              subtitleView = null
                          }
                      }

                      subtitleView?.findViewById<TextView>(R.id.tvOriginalText)?.text = original.ifEmpty { "Koi text nahi mila" }
                      subtitleView?.findViewById<TextView>(R.id.tvHinglishText)?.text = hinglish

                      mainHandler.removeCallbacksAndMessages(null)
                      mainHandler.postDelayed({
                          if (subtitleView != null) {
                              windowManager?.removeView(subtitleView)
                              subtitleView = null
                          }
                      }, 6000)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (bubbleView != null) windowManager?.removeView(bubbleView)
                  if (subtitleView != null) windowManager?.removeView(subtitleView)
                  virtualDisplay?.release()
                  mediaProjection?.stop()
                  imageReader?.close()
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SubBro APK
        uses: actions/upload-artifact@v4
        with:
          name: SubBro-App
          path: app/build/outputs/apk/debug/app-debug.apk
